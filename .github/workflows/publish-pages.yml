name: Publish Site Branch

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or ref to publish"
        required: true
        default: "main"
      target_branch:
        description: "Branch used by GitHub Pages"
        required: true
        default: "publish"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Push source ref to publish branch
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git push --force-with-lease origin "${SOURCE_REF}:${TARGET_BRANCH}"
